<!DOCTYPE html>
  <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport"content="width=device-width,initial-scale=1.0">
      <title>
        PlatinumGames
      </title>
      <link rel="stylesheet" href="style.css">
    </head>
     <body>
       <div style="display: flex; justify-content: center; align-items: flex-start; height: 100vh;">
         <img src="imagens/logo.png" alt="" class="logo">
       </div>
         <p style="text-align: center;"><input type="text" id="campoPesquisa" placeholder="Pesquise o jogo">

<!-- O botão que dispara a função -->
<button onclick="buscarPagina()">Pesquisar</button>

<script>
function buscarPagina() {
    // 1. Pega o valor digitado e transforma em letras minúsculas
    const termo = document.getElementById('campoPesquisa').value.toLowerCase().trim();

    // 2. Banco de dados simples (Palavra-chave : Página de destino)
    const paginas = {
        "minecraft": "minecraft.html",
        "god of war": "godofwar.html",
        "batman arkham night": "batmanarkhamnight.html",
    };

    // 3. Verifica se o termo existe no banco de dados
    if (paginas[termo]) {
        // Redireciona para a página correspondente
        window.location.href = paginas[termo];
    } else {
        // Mensagem caso não encontre nada
        alert("Página não encontrada! Tente 'home', 'sobre' ou 'contato'.");
    }
}
</script></p>
       
     </body>
